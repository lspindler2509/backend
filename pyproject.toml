[project]
name = "drugstone_backend"
version = "2.2.0"
description = "This is the backend project for the Drugst.One plugin and website"
authors = [
    {name = "Andreas Maier", email = "andreas.maier-1@uni-hamburg.de>"},
    {name = "Michael Hartung", email = "michael.hartung@uni-hamburg.de"},
    {name = "Lisa Spindler", email="lisa.spindler@tum.de"}]
maintainers = [
  {name = "Andreas Maier", email = "andreas.maier-1@uni-hamburg.de>"}
]
requires-python = ">=3.10,<3.14"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
readme= "README.md"
license = "GPL-3.0-or-later"

dependencies = [
    "celery>=5.2.7,<6",
    "chardet==3.0.4",
    "cryptography>=36.0.7",
    "decorator==4.4.2",
    "distinctipy==1.3.4",
    "django>=5.2.13,<6",
    "django-cors-headers>=3.4,<4",
    "django-redis>=6.0.0,<7",
    "django-rq-dashboard>=0.3.3,<0.4",
    "djangorestframework>=3.16.0,<4",
    "djangorestframework-camel-case>=1.4.2,<2",
    "goatools==1.5.2",
    "gseapy==1.1.2",
    "leidenalg==0.10.2",
    "matplotlib==3.8.0",
    "networkx==3.1",
    "numpy>=1.23.5,<2",
    "omnipath==1.0.8",
    "pandas>=2.0.0",
    "pillow>=12.2.0,<13",
    "psycopg2-binary==2.9.10",
    "python-dateutil>=2.8.2",
    "python-louvain==0.16",
    "redis>=7.2.0,<8",
    "rq>=1.11.1,<2",
    "requests>=2.32.4,<3",
    "sqlalchemy>=1.3.23,<2",
    "sqlparse>=0.5.4,<0.6",
    "urllib3>=2.6.3,<3",
]

[dependency-groups]
dev = [
    "flake8==6.0.0",
    "flake8-quotes==3.3.2",
    "mccabe==0.7.0",
    "entrypoints==0.3",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"
